<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — RetailInsight</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/contact.css') }}">
  <style>
    .auth-wrap { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: var(--space-7) var(--space-4); }
    .auth-card { width: 100%; max-width: 420px; padding: var(--space-6); }
    .auth-tabs { display: flex; background: var(--surface-tint); border-radius: var(--radius-pill); padding: 4px; margin-bottom: var(--space-5); }
    .auth-tab { flex: 1; text-align: center; padding: 10px; border-radius: var(--radius-pill); font-weight: 600; font-size: 0.9rem; cursor: pointer; color: var(--text-muted); transition: all 0.25s var(--ease); }
    .auth-tab.is-active { background: var(--surface); color: var(--forest-950); box-shadow: var(--shadow-sm); }
    .auth-form { display: none; flex-direction: column; gap: 14px; }
    .auth-form.is-active { display: flex; }
    .auth-form label { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
    .auth-form input, .auth-form select {
      font-family: var(--font-body); font-size: 0.95rem; padding: 12px 14px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border); background: var(--bg); color: var(--text-primary);
    }
    .auth-form input:focus, .auth-form select:focus { outline: none; border-color: var(--sage-500); }
    .auth-error { display: none; background: rgba(179,69,45,0.1); color: var(--danger); font-size: 0.85rem; padding: 10px 14px; border-radius: var(--radius-sm); }
    .auth-error.is-visible { display: block; }
    .auth-alt { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-top: var(--space-4); }
  </style>
</head>
<body>
  {% include "includes/navbar.html" %}

  <section class="auth-wrap">
    <div class="card auth-card reveal">
      <div class="auth-tabs">
        <div class="auth-tab is-active" data-tab="login">Log in</div>
        <div class="auth-tab" data-tab="signup">Sign up</div>
      </div>

      <p class="auth-error" data-auth-error></p>

      <form class="auth-form is-active" data-form="login" method="POST" action="{{ url_for('login') }}">
        <label>Email
          <input type="email" name="email" required placeholder="you@yourshop.com">
        </label>
        <label>Password
          <input type="password" name="password" required placeholder="••••••••">
        </label>
        <button type="submit" class="btn btn-primary">Log in to dashboard</button>
        <p class="auth-alt">Forgot password? <a href="#" style="color:var(--forest-700);font-weight:600;">Reset it</a></p>
      </form>

      <form class="auth-form" data-form="signup" id="signup" method="POST" action="{{ url_for('login') }}">
        <label>Shop name
          <input type="text" name="shop_name" required placeholder="Nokshi Boutique">
        </label>
        <label>Email
          <input type="email" name="email" required placeholder="you@yourshop.com">
        </label>
        <label>Password
          <input type="password" name="password" required placeholder="At least 8 characters" minlength="8">
        </label>
        <label>Role
          <select name="role">
            <option value="owner">Owner</option>
            <option value="staff">Staff</option>
          </select>
        </label>
        <button type="submit" class="btn btn-primary">Create free account</button>
        <p class="auth-alt">By signing up you agree to our Terms &amp; Privacy Policy.</p>
      </form>
    </div>
  </section>

  {% include "includes/footer.html" %}
  <script src="{{ url_for('static', filename='js/global.js') }}"></script>
  <script src="{{ url_for('static', filename='js/dark-mode.js') }}"></script>
  <script>
    document.querySelectorAll(".auth-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".auth-tab").forEach((t) => t.classList.remove("is-active"));
        document.querySelectorAll(".auth-form").forEach((f) => f.classList.remove("is-active"));
        tab.classList.add("is-active");
        document.querySelector(`[data-form="${tab.dataset.tab}"]`).classList.add("is-active");
      });
    });
    if (window.location.hash === "#signup") {
      document.querySelector('[data-tab="signup"]').click();
    }
  </script>
</body>
</html>
