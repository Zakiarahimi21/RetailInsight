<aside class="sidebar">
  <a href="{{ url_for('home') }}" class="sidebar-brand">
    <span class="brand-mark">RI</span>
    <span class="brand-name">RetailInsight</span>
  </a>

  <nav class="sidebar-nav">
    <a href="{{ url_for('dashboard.index') }}" class="sidebar-link {{ 'is-active' if active == 'home' else '' }}">
      <span class="sidebar-icon">🏠</span> Overview
    </a>
    <a href="{{ url_for('dashboard.sales') }}" class="sidebar-link {{ 'is-active' if active == 'sales' else '' }}">
      <span class="sidebar-icon">📈</span> Sales
    </a>
    <a href="{{ url_for('dashboard.products') }}" class="sidebar-link {{ 'is-active' if active == 'products' else '' }}">
      <span class="sidebar-icon">🏆</span> Products
    </a>
    <a href="{{ url_for('dashboard.customers') }}" class="sidebar-link {{ 'is-active' if active == 'customers' else '' }}">
      <span class="sidebar-icon">👥</span> Customers
    </a>
    <a href="{{ url_for('dashboard.reports') }}" class="sidebar-link {{ 'is-active' if active == 'reports' else '' }}">
      <span class="sidebar-icon">🧾</span> Reports
    </a>
    <a href="{{ url_for('dashboard.forecast') }}" class="sidebar-link {{ 'is-active' if active == 'forecast' else '' }}">
      <span class="sidebar-icon">🔮</span> Forecast
    </a>
    {% if role == 'owner' %}
    <a href="{{ url_for('dashboard.settings') }}" class="sidebar-link {{ 'is-active' if active == 'settings' else '' }}">
      <span class="sidebar-icon">⚙️</span> Settings
    </a>
    {% endif %}
  </nav>

  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="avatar">{{ (session.get('role','S'))[0]|upper }}</div>
      <div><strong>{{ role|capitalize }}</strong><span>Signed in</span></div>
    </div>
    <a href="{{ url_for('home') }}" class="sidebar-logout">Log out</a>
  </div>
</aside>
